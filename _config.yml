# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Priscila
middle_name: 
last_name: Drummond
email: deazevedodrummond.p@northeastern.edu
contact_note: >
  Feel free to reach out at deazevedodrummond.p@northeastern.edu
  or pridrum@gmail.com
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  PhD Candidate in Industrial Engineering & Operations Research at Northeastern University.
  Teaching Fellow. Researcher in OR for Social Good, anti-human trafficking, and inclusive pedagogy.
  2026 COE Outstanding Graduate Teaching Award recipient.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: >
  operations research, industrial engineering, teaching, social justice,
  anti-human trafficking, optimization, inclusive pedagogy, Northeastern University,
  academic portfolio, OR for social good
lang: en
icon: 📐  # math/engineering feel; swap for ⚙️ or 🎓 if you prefer

url: https://pdeazevedodrummond.github.io  # UPDATE: replace with your actual GitHub username URL
baseurl: ""  # Leave blank — your repo IS the user/org page (username.github.io)
last_updated: true
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: true
  theme_light: flat
  theme_dark: gitdimmed

external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# Social links
# (al-folio uses these to auto-generate icons in the sidebar/footer)
# Fill in what you have; comment out what you don't yet
# -----------------------------------------------------------------------------

# UPDATE these with your actual profile handles/URLs:
github_username: pdeazevedodrummond        # your GitHub username
linkedin_username: priscila-de-azevedo-drummond   # your LinkedIn handle
google_scholar_userid:  https://scholar.google.com/citations?hl=en&user=RuQheT8AAAAJ                   # find at scholar.google.com — looks like: XXXXXXXXXXXXXXX
orcid_id:    0000-0002-0028-271X                              # format: 0000-0000-0000-0000 (register free at orcid.org)
# twitter_username:                        # uncomment if you have one
# researchgate_username:                   # uncomment if you have one

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true   # enables rich preview cards when sharing your site on LinkedIn, etc.
serve_schema_org: true
og_image:             # add a photo to assets/img/ and reference it here, e.g. prof_pic.jpg

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

google_analytics:        # add your G-XXXXXXXXXX once you set up GA4 (optional)
cronitor_analytics:
pirsch_analytics:
openpanel_analytics:
google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Teaching & Research Notes
blog_description: >
  Reflections on teaching operations research, inclusive pedagogy,
  and OR for social good — by Priscila de Azevedo Drummond.
permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus comments — set up at https://giscus.app/ using your repo
giscus:
  repo:           # e.g. pridrum/pri-drummond.github.io
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: dark
  light_theme: light
  emit_metadata: 0
  lang: en

disqus_shortname: # leave blank (giscus is preferred)

external_sources:   # remove or configure if you publish on Medium, etc.

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages", "_scripts"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Scholar — YOUR publications
# -----------------------------------------------------------------------------

scholar:
  last_name: [Drummond]
  first_name: [Priscila, P., P.A., "Priscila de Azevedo"]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
  inspirehep: false   # set to true if you get an InspireHEP ID (more for physics/CS)

filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

max_author_limit: 5   # shows more co-authors before "show more" — good for your multi-author PLOS One paper
more_authors_animation_delay: 10
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false  # flip to true once you add your GA4 ID above
enable_cronitor_analytics: false
enable_pirsch_analytics: false
enable_openpanel_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true
enable_math: true      # IMPORTANT — keep true for OR/optimization content (LaTeX rendering)
enable_tooltips: true  # nice for a content-rich academic site
enable_darkmode: true
enable_navbar_social: true   # shows social icons in navbar — good for visibility
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Jekyll Minifier & Terser
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false
  exclude: ["robots.txt", "assets/js/search/*.js"]

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: [year, tags, categories]

display_tags: ["teaching", "operations-research", "optimization", "social-justice", "inclusive-pedagogy", "OR"]
display_categories: ["teaching-notes", "research", "news"]

# -----------------------------------------------------------------------------
# Get external JSON data (for resume.json — the /cv page)
# -----------------------------------------------------------------------------

jekyll_get_json:
  - data: resume
    json: assets/json/resume.json

jsonresume:
  - basics
  - work
  - education
  - publications
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references
